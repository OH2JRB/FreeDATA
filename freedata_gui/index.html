<!doctype html>
<html lang="">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <title>FreeDATA</title>

    <!-- Favicon for browsers -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16x16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/android-chrome-192x192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/android-chrome-512x512.png"
    />

    <!-- Apple touch icon -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Android icons -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Prevent status bar from showing on iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <!-- Add custom JavaScript to set the viewport height -->
    <script>
      function setAppHeight() {
        const appHeight = window.visualViewport?.height || window.innerHeight;
        document.documentElement.style.setProperty(
          "--app-height",
          `${appHeight}px`,
        );
      }
      window.addEventListener("resize", setAppHeight);
      window.addEventListener("orientationchange", setAppHeight);
      document.addEventListener("DOMContentLoaded", setAppHeight);
    </script>
  </head>

  <body>
    <noscript>
      <strong
        >We're sorry but FreeDATA doesn't work
        properly without JavaScript enabled. Please enable it to
        continue.</strong
      >
    </noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
