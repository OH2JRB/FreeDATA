name: Build and Release NSIS Installer
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-and-release:
    # The fork's default workflow token is read-only; creating the draft
    # release and uploading its files needs write access to contents
    permissions:
      contents: write
    runs-on: windows-latest
    env:
      # the Hamlib release bundled in the installer (and listed in the SBOM)
      HAMLIB_VERSION: "4.7.2"
      # SHA-256 of hamlib-w64-<version>.zip, from the Hamlib release page;
      # update it together with HAMLIB_VERSION
      HAMLIB_SHA256: "8553bc6c5c6032e8debf99c017e98f58fed7e07e7c25d04815dc3e8bbe3304c7"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install NSIS via choco
        run: choco install nsis

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Vue Builder
        working-directory: freedata_gui
        run: |
          npm ci
          npm run build

      - name: LIST ALL FILES
        run: ls -R

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[nuitka]

      - name: Download Hamlib
        working-directory: freedata_server
        run: |
          $zip = "hamlib-w64-$env:HAMLIB_VERSION.zip"
          Invoke-WebRequest "https://github.com/Hamlib/Hamlib/releases/download/$env:HAMLIB_VERSION/$zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:HAMLIB_SHA256) { throw "$zip has SHA-256 $hash, expected $env:HAMLIB_SHA256" }
          Expand-Archive $zip -DestinationPath lib/hamlib
          # move the contents of the versioned folder up into lib/hamlib
          $HAMLIB_DIR = Get-Item "lib/hamlib/hamlib-w64-$env:HAMLIB_VERSION"
          Move-Item "$($HAMLIB_DIR.FullName)\*" "lib/hamlib" -Force
          Remove-Item "$($HAMLIB_DIR.FullName)" -Recurse -Force
          Remove-Item $zip
        shell: pwsh


      - name: Write third-party licenses
        # lists the Python and GUI packages actually installed for this build
        run: python tools/third_party_licenses.py

      - name: Write SBOM
        # CycloneDX: the Python packages (from a fresh environment with only
        # FreeDATA installed), the GUI's packages and the native libraries
        run: |
          pip install cyclonedx-bom
          python tools/make_sbom.py --platform windows --hamlib-version $env:HAMLIB_VERSION
        shell: pwsh

      - name: Build binaries
        working-directory: freedata_server
        run: |
          python3 -m nuitka `
            --remove-output `
            --assume-yes-for-downloads `
            --follow-imports `
            --include-data-dir=lib=lib `
            --include-data-dir=../freedata_gui/dist=gui `
            --include-data-files=lib/codec2/*=lib/codec2/ `
            --include-data-files=lib/hamlib/bin/*.exe=lib/hamlib/bin/ `
            --include-data-files=lib/hamlib/bin/*.dll=lib/hamlib/bin/ `
            --include-data-files=config.ini.example=config.ini.example `
            --include-data-dir=data=data `
            --include-data-files=../LICENSE=LICENSE.txt `
            --include-data-files=../THIRD-PARTY-LICENSES.txt=THIRD-PARTY-LICENSES.txt `
            --nofollow-import-to=sqlalchemy.dialects.mysql,sqlalchemy.dialects.mariadb,sqlalchemy.dialects.postgresql,sqlalchemy.dialects.oracle,sqlalchemy.dialects.mssql,sqlalchemy.testing `
            --include-module=sqlalchemy.dialects.sqlite `
            --standalone server.py `
            --output-filename=freedata-server `
            --low-memory
        shell: pwsh

      # Start the built server once: it must answer, and find the files it
      # needs inside the build (codec2 and the band plan). Config, database
      # and logs go to the runner's temp folder, not into the installer.
      - name: Test server
        shell: pwsh
        env:
          FREEDATA_CONFIG: ${{ runner.temp }}/freedata/config.ini
          FREEDATA_DATABASE: ${{ runner.temp }}/freedata/freedata-messages.db
        run: |
          $log = "${{ runner.temp }}/freedata-server.log"
          $err = "${{ runner.temp }}/freedata-server.err.log"
          $p = Start-Process freedata_server/server.dist/freedata-server.exe -RedirectStandardOutput $log -RedirectStandardError $err -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try { Invoke-RestMethod http://127.0.0.1:5000/ -TimeoutSec 2 | Out-Null; $ok = $true; break } catch { Start-Sleep 1 }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Content $log, $err
          if (-not $ok) { throw "server did not answer" }
          if (-not (Select-String -Path $log, $err -Pattern "Libcodec2 loaded" -Quiet)) { throw "codec2 not loaded" }
          if (-not (Select-String -Path $log, $err -Pattern "Band plan loaded" -Quiet)) { throw "band plan not loaded" }

      - name: LIST ALL FILES
        run: ls -R

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(python -c 'import re; print(re.search(r"MODEM_VERSION = \"([^\"]+)\"", open("freedata_server/constants.py").read()).group(1))')" >> "$GITHUB_OUTPUT"

      - name: Create installer
        uses: joncloud/makensis-action@971ef20f43e4f9f3af2c7f276cb7348d033da1cd # v5.0
        with:
          script-file: "freedata-nsis-config.nsi"
          arguments: '/V3 /DVERSION=${{ steps.version.outputs.version }}'

      - name: LIST ALL FILES
        working-directory: freedata_server/server.dist
        run: ls -R

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 'FreeDATA-Installer'
          path: ./FreeDATA-Installer.exe

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 'FreeDATA-SBOM-windows'
          path: ./freedata-sbom_windows.cdx.json

      # the plain server zip, for running without the installer (made on every
      # run, so a test run checks it; only a tag uploads it)
      - name: Zip server
        run: Compress-Archive -Path freedata_server/server.dist/* -DestinationPath freedata-server_windows.zip
        shell: pwsh

      # lets users check a download: Get-FileHash, or sha256sum -c
      - name: Write SHA-256 sums
        run: |
          $files = "FreeDATA-Installer.exe", "freedata-server_windows.zip", "freedata-sbom_windows.cdx.json"
          $lines = foreach ($f in $files) { "$((Get-FileHash $f -Algorithm SHA256).Hash.ToLower())  $f" }
          [IO.File]::WriteAllText("SHA256SUMS-windows.txt", ($lines -join "`n") + "`n")
          Get-Content SHA256SUMS-windows.txt
        shell: pwsh

      - name: Upload Installer to Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          # a draft, like the AppImage's: published by hand once checked
          draft: true
          files: |
            ./FreeDATA-Installer.exe
            ./freedata-server_windows.zip
            ./freedata-sbom_windows.cdx.json
            ./SHA256SUMS-windows.txt
          tag_name: ${{ github.ref_name }}
