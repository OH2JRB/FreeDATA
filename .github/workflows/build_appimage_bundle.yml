name: Build and Release APPIMAGE Installer
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner image, e.g. ubuntu-latest or ubuntu-26.04"
        default: ubuntu-latest

# The AppImage contains the Nuitka-built server with the web GUI bundled in
# (like the Windows installer). Starting it starts the server, which serves
# the GUI on http://127.0.0.1:5000/gui and opens it in the browser.
# The AppImage needs at least the glibc of the runner image it was built on.

jobs:
  build-and-release:
    # The fork's default workflow token is read-only; creating the draft
    # release and uploading its files needs write access to contents
    permissions:
      contents: write
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build GUI
        working-directory: freedata_gui
        run: npm run build

      - name: Install Linux dependencies
        run: |
          sudo apt update
          sudo apt install -y portaudio19-dev libhamlib-dev libhamlib-utils build-essential cmake patchelf desktop-file-utils zip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[nuitka]

      - name: Write third-party licenses
        # lists the Python and GUI packages actually installed for this build
        run: python tools/third_party_licenses.py

      - name: Build binaries
        working-directory: freedata_server
        run: |
          python3 -m nuitka \
            --remove-output \
            --assume-yes-for-downloads \
            --follow-imports \
            --include-data-dir=lib=lib \
            --include-data-dir=../freedata_gui/dist=gui \
            --include-data-files=lib/codec2/*=lib/codec2/ \
            --include-data-files=config.ini.example=config.ini.example \
            --include-data-dir=data=data \
            --include-data-files=../LICENSE=LICENSE.txt \
            --include-data-files=../THIRD-PARTY-LICENSES.txt=THIRD-PARTY-LICENSES.txt \
            --nofollow-import-to=sqlalchemy.dialects.mysql,sqlalchemy.dialects.mariadb,sqlalchemy.dialects.postgresql,sqlalchemy.dialects.oracle,sqlalchemy.dialects.mssql,sqlalchemy.testing \
            --include-module=sqlalchemy.dialects.sqlite \
            --standalone server.py \
            --output-filename=freedata-server

      - name: Prepare AppImage folder
        run: |
          APPDIR=$HOME/freedata-appimage
          mkdir -p $APPDIR/server
          cp -r freedata_server/server.dist/* $APPDIR/server
          cp freedata_gui/public/android-chrome-512x512.png $APPDIR/freedata.png

          cat > $APPDIR/FreeDATA.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=FreeDATA
          Comment=HF data modem with web GUI
          Icon=freedata
          Exec=AppRun
          Terminal=false
          Categories=Network;HamRadio;
          EOF
          desktop-file-validate $APPDIR/FreeDATA.desktop

          # The server creates ~/.config/FreeDATA/config.ini from its bundled
          # config.ini.example on first start and keeps the database there too.
          cat > $APPDIR/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/server/freedata-server" "$@"
          EOF
          chmod +x $APPDIR/AppRun

      - name: Download appimagetool
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Build AppImage
        env:
          ARCH: x86_64
          # newer Ubuntu images have no libfuse2, run appimagetool without FUSE
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: ./appimagetool-x86_64.AppImage $HOME/freedata-appimage FreeDATA-x86_64.AppImage

      - name: Test AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          XDG_CONFIG_HOME: ${{ runner.temp }}/freedata-config
        run: |
          # runners have no sound server, so this also checks the server
          # keeps running when PortAudio can't start
          ./FreeDATA-x86_64.AppImage > appimage.log 2>&1 &
          PID=$!
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5000/ > /dev/null && curl -fsS http://127.0.0.1:5000/gui/ | grep -q "<title>"; then
              ok=1
              break
            fi
            sleep 1
          done
          kill $PID || true
          cat appimage.log
          grep "Band plan loaded" appimage.log
          test -f "$XDG_CONFIG_HOME/FreeDATA/config.ini"
          test $ok = 1

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: 'FreeDATA-x86_64.AppImage'
          path: FreeDATA-x86_64.AppImage

      # the plain server zip, for running without the AppImage
      - name: Zip server
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: freedata_server/server.dist
        run: zip -qr ../../freedata-server_ubuntu.zip .

      - name: Upload Installer to Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          draft: true
          files: |
            FreeDATA-x86_64.AppImage
            freedata-server_ubuntu.zip
          tag_name: ${{ github.ref_name }}
          name: 'FreeDATA-x86_64.AppImage'
