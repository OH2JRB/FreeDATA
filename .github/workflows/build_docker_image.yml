name: Build and Release Docker Image
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    name: Build image, smoke test it and upload artifact
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build a single-architecture image (using linux/amd64) so we can load it locally.
      - name: Build Docker image for artifact
        run: |
          docker buildx build --platform linux/amd64 --load -t freedata:latest .

      # Start the image as a user would: the server must answer on the published
      # port, serve the GUI, load codec2 and the band plan, and rigctld must run
      - name: Smoke test
        run: |
          docker run -d --name freedata -p 5000:5000 freedata:latest
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/; then ok=1; break; fi
            sleep 2
          done
          echo
          docker logs freedata
          test "$ok" = 1
          curl -fsS -o /dev/null http://127.0.0.1:5000/gui/
          docker logs freedata 2>&1 | grep "Libcodec2 loaded"
          docker logs freedata 2>&1 | grep "Band plan loaded"
          docker exec freedata rigctld --version
          docker stop freedata

      # Save the built image as a tarball.
      - name: Save Docker image to tar file
        run: |
          docker save freedata:latest -o freedata.tar

      # Upload the image tarball as an artifact.
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: freedata-image
          path: freedata.tar

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    name: Build and Publish Release
    # id-token, attestations and artifact-metadata let actions/attest sign
    # the image's build provenance
    permissions:
      packages: write
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ghcr.io names must be lower case: ghcr.io/<owner>/freedata
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/freedata" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch Docker images
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.title=FreeDATA
            org.opencontainers.image.description=Docker image for FreeDATA
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}

      # signed build provenance, pushed to ghcr.io with the image
      # (gh attestation verify oci://..., see SECURITY.md)
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
