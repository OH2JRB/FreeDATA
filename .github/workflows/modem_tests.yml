name: Modem tests

on: [push]

jobs:
  build:
    # The CMake configure and build commands are platform-agnostic and should work equally
    # well on Windows or Mac.  You can convert this to a matrix build if you need
    # cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-latest
    strategy:
      # By default, GitHub will maximize the number of jobs run in parallel
      # depending on the available runners on GitHub-hosted virtual machines.
      # max-parallel: 8
      fail-fast: false
      matrix:
        include:
          #- python-version: "3.7" EOL
          #- python-version: "3.8" EOL
          #- python-version: "3.9" EOL
          #- python-version: "3.10" dropped, 3.12 is the oldest tested version
          #- python-version: "3.11" dropped, 3.12 is the oldest tested version
          - python-version: "3.12"
          - python-version: "3.13"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}


      - name: Install system packages
        shell: bash
        run: |
          sudo apt-get update || true
          sudo apt-get install --no-install-recommends portaudio19-dev

      - name: Install python packages
        shell: bash
        run: |
          pip install .[test]

      - name: run config tests
        shell: bash
        run: |
          python -m unittest discover tests
